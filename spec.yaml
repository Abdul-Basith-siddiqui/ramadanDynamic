                  type: string
                  format: date-time
                minPurchaseAmount:
                  type: number
                maxDiscountAmount:
                  type: number
                usageLimit:
                  type: integer
                isActive:
                  type: boolean
      responses:
        '201':
          description: Coupon created successfully
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/coupons/{code}/validate:
    get:
      tags: [Coupons]
      summary: Validate coupon code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Coupon validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  coupon:
                    type: object
                    properties:
                      code:
                        type: string
                      discountType:
                        type: string
                      discountValue:
                        type: number
                      minPurchaseAmount:
                        type: number
                      maxDiscountAmount:
                        type: number
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/coupons/{id}:
    put:
      tags: [Coupons]
      summary: Update coupon (Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                discountValue:
                  type: number
                validUntil:
                  type: string
                  format: date-time
                isActive:
                  type: boolean
      responses:
        '200':
          description: Coupon updated successfully
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Coupons]
      summary: Delete coupon (Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Coupon deleted successfully
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/inventory/low-stock:
    get:
      tags: [Inventory]
      summary: Get low stock books (Admin)
      parameters:
        - name: threshold
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Low stock books
          content:
            application/json:
              schema:
                type: object
                properties:
                  books:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book'
                  threshold:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/inventory/movements:
    get:
      tags: [Inventory]
      summary: Get inventory movements (Admin)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: book
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [purchase, adjustment, damage, return, sale]
      responses:
        '200':
          description: Inventory movements
          content:
            application/json:
              schema:
                type: object
                properties:
                  movements:
                    type: array
                    items:
                      type: object
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/inventory/adjust:
    post:
      tags: [Inventory]
      summary: Adjust inventory (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookId, quantity, type]
              properties:
                bookId:
                  type: string
                quantity:
                  type: integer
                type:
                  type: string
                  enum: [purchase, adjustment, damage, return]
                notes:
                  type: string
      responses:
        '200':
          description: Inventory adjusted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/inventory/stats:
    get:
      tags: [Inventory]
      summary: Get inventory statistics (Admin)
      responses:
        '200':
          description: Inventory statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats:
                    type: object
                    properties:
                      totalBooks:
                        type: integer
                      totalStock:
                        type: integer
                      outOfStock:
                        type: integer
                      lowStock:
                        type: integer
                      totalValue:
                        type: number
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/analytics/dashboard:
    get:
      tags: [Analytics]
      summary: Get dashboard analytics (Admin)
      responses:
        '200':
          description: Dashboard analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  dashboard:
                    type: object
                    properties:
                      totalRevenue:
                        type: number
                      totalOrders:
                        type: integer
                      totalCustomers:
                        type: integer
                      totalBooks:
                        type: integer
                      recentOrders:
                        type: array
                        items:
                          $ref: '#/components/schemas/Order'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/analytics/sales:
    get:
      tags: [Analytics]
      summary: Get sales analytics (Admin)
      parameters:
        - name: period
          in: query
          schema:
            type: string
            default: 30d
      responses:
        '200':
          description: Sales analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  sales:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        totalSales:
                          type: number
                        orderCount:
                          type: integer
                  period:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/analytics/revenue:
    get:
      tags: [Analytics]
      summary: Get revenue analytics (Admin)
      responses:
        '200':
          description: Revenue analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  revenue:
                    type: object
                    properties:
                      currentMonth:
                        type: number
                      lastMonth:
                        type: number
                      growth:
                        type: string
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/analytics/top-books:
    get:
      tags: [Analytics]
      summary: Get top selling books (Admin)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Top selling books
          content:
            application/json:
              schema:
                type: object
                properties:
                  topBooks:
                    type: array
                    items:
                      type: object
                      properties:
                        book:
                          $ref: '#/components/schemas/Book'
                        totalSold:
                          type: integer
                        totalRevenue:
                          type: number
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/analytics/customers:
    get:
      tags: [Analytics]
      summary: Get customer analytics (Admin)
      responses:
        '200':
          description: Customer analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  customers:
                    type: object
                    properties:
                      total:
                        type: integer
                      new:
                        type: integer
                      topCustomers:
                        type: array
                        items:
                          type: object
                          properties:
                            customer:
                              $ref: '#/components/schemas/User'
                            totalOrders:
                              type: integer
                            totalSpent:
                              type: number
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/notifications:
    get:
      tags: [Notifications]
      summary: Get user notifications
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: User notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  unreadCount:
                    type: integer
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /api/notifications/{id}/read:
    put:
      tags: [Notifications]
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification marked as read
        '404':
          $ref: '#/components/responses/NotFound'

  /api/notifications/read-all:
    put:
      tags: [Notifications]
      summary: Mark all notifications as read
      responses:
        '200':
          description: All notifications marked as read

  /api/notifications/{id}:
    delete:
      tags: [Notifications]
      summary: Delete notification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'

  /api/seed/production:
    post:
      tags: [Seed]
      summary: Trigger production database seeding
      description: Seeds the production database with initial data (admin user, categories, shipping zones). Only creates data if it doesn't exist. Admin access required.
      responses:
        '200':
          description: Seeding completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  details:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/seed/status:
    get:
      tags: [Seed]
      summary: Check seeding status
      description: Returns information about what data already exists in the database
      responses:
        '200':
          description: Status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: object
                    properties:
                      adminUser:
                        type: object
                        properties:
                          exists:
                            type: boolean
                          email:
                            type: string
                      categories:
                        type: object
                        properties:
                          count:
                            type: integer
                          seeded:
                            type: boolean
                      shippingZones:
                        type: object
                        properties:
                          count:
                            type: integer
                          seeded:
                            type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [user, admin]
        isActive:
          type: boolean
        wishlist:
          type: array
          items:
            type: string
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        phone:
          type: string
        avatar:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        country:
          type: string
        isDefault:
          type: boolean

    Book:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        isbn:
          type: string
        description:
          type: string
        author:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Author'
        categories:
          type: array
          items:
            oneOf:
              - type: string
              - $ref: '#/components/schemas/Category'
        publisher:
          type: string
        publishDate:
          type: string
          format: date-time
        language:
          type: string
        pages:
          type: integer
        price:
          type: number
          minimum: 0
        comparePrice:
          type: number
          minimum: 0
        stock:
          type: integer
          minimum: 0
        images:
          type: array
          items:
            type: string
            format: uri
        coverImage:
          type: string
          format: uri
        format:
          type: string
          enum: [Hardcover, Paperback, eBook, Audiobook]
        dimensions:
          type: object
          properties:
            length:
              type: number
            width:
              type: number
            height:
              type: number
            unit:
              type: string
        weight:
          type: number
        rating:
          type: number
          minimum: 0
          maximum: 5
        reviewCount:
          type: integer
          minimum: 0
        isFeatured:
          type: boolean
        isBestseller:
          type: boolean
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Author:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        bio:
          type: string
        image:
          type: string
          format: uri
        nationality:
          type: string
        birthDate:
          type: string
          format: date
        website:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        image:
          type: string
          format: uri
        parent:
          type: string
        order:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Review:
      type: object
      properties:
        id:
          type: string
        book:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Book'
        user:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/User'
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
        comment:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        isVerifiedPurchase:
          type: boolean
        helpfulCount:
          type: integer
        helpfulBy:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Cart:
      type: object
      properties:
        id:
          type: string
        user:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              book:
                oneOf:
                  - type: string
                  - $ref: '#/components/schemas/Book'
              quantity:
                type: integer
                minimum: 1
              price:
                type: number
                minimum: 0
        totalAmount:
          type: number
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Order:
      type: object
      properties:
        id:
          type: string
        orderNumber:
          type: string
        user:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/User'
        items:
          type: array
          items:
            type: object
            properties:
              book:
                type: string
              title:
                type: string
              isbn:
                type: string
              quantity:
                type: integer
              price:
                type: number
              total:
                type: number
        shippingAddress:
          $ref: '#/components/schemas/ShippingAddress'
        paymentMethod:
          type: string
        paymentStatus:
          type: string
          enum: [pending, paid, failed, refunded]
        orderStatus:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
        subtotal:
          type: number
        shippingCost:
          type: number
        tax:
          type: number
        discount:
          type: number
        total:
          type: number
        couponCode:
          type: string
        trackingNumber:
          type: string
        shippingMethod:
          type: string
        notes:
          type: string
        cancelReason:
          type: string
        refundAmount:
          type: number
        refundReason:
          type: string
        paidAt:
          type: string
          format: date-time
        shippedAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ShippingAddress:
      type: object
      required: [firstName, lastName, street, city, state, zipCode, country, phone]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        street:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        country:
          type: string
        phone:
          type: string

    Coupon:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        discountType:
          type: string
          enum: [percentage, fixed]
        discountValue:
          type: number
          minimum: 0
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        minPurchaseAmount:
          type: number
        maxDiscountAmount:
          type: number
        usageLimit:
          type: integer
        usageCount:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: string
        user:
          type: string
        type:
          type: string
          enum: [order, promotion, system]
        title:
          type: string
        message:
          type: string
        link:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    Unauthorized:
      description: Unauthorized - authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              error:
                type: string
